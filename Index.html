      window.addEventListener("error", function (event) {
        const errorObj = {
          message: event.message,
          source: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error ? event.error.stack : null
        };
        window.parent.postMessage(
          { action: "error", error: JSON.stringify(errorObj) },
          "*"
        );
        event.preventDefault();
      });

  function handleImportError(error) {
    throw new Error('Import module failed: ' + error.target.src);
  }

  const observer = new MutationObserver(mutations => {
    mutations.forEach(mutation => {
      mutation.addedNodes.forEach(node => {
        if (node.tagName === 'SCRIPT' && node.type === 'module') {
          node.onerror = handleImportError;
        }
      });
    });
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });

  document.querySelectorAll('script[type="module"]').forEach(script => {
    script.onerror = handleImportError;
  });

  
window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});

//  USE AUTH HOOK
// ════════════════════════════════════════════════════════════════════

function useAuth() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const session = loadData(STORAGE_KEYS.SESSION, null);
    if (session) setUser(session);
    setLoading(false);
  }, []);

  const login = (username, password) => {
    const users = loadData(STORAGE_KEYS.USERS, DEFAULT_USERS);
    const found = users.find((u) => u.username === username && u.password === password);
    if (found) {
      const session = { username: found.username, name: found.name, role: found.role };
      saveData(STORAGE_KEYS.SESSION, session);
      setUser(session);
      return true;
    }
    return false;
  };

  const register = (username, password, name) => {
    const users = loadData(STORAGE_KEYS.USERS, DEFAULT_USERS);
    if (users.find((u) => u.username === username)) return false;
    users.push({ username, password, name, role: "user" });
    saveData(STORAGE_KEYS.USERS, users);
    return true;
  };

  const logout = () => {
    localStorage.removeItem(STORAGE_KEYS.SESSION);
    setUser(null);
  };

  return { user, loading, login, register, logout };
}

}

function SelectFilter({ label, value, onChange, options }) {

        value={value}

      className={`flex items-center gap-2 px-5 py-3 rounded-xl text-sm font-medium transition-all ${
        active
          ? "bg-cyan-500 text-white shadow-lg shadow-cyan-500/25"
          : "text-slate-400 hover:text-white hover:bg-slate-800/60"
      }`}
    >
      <Icon size={18} />
      {label}
    </button>
  );
}

// ════════════════════════════════════════════════════════════════════
//  PANEL DIRECTIVO
// ════════════════════════════════════════════════════════════════════

function PanelDirectivo({ cedulas }) {
  const total = cedulas.length;
  const cumplidas = cedulas.filter((c) => c.estatus === "Cumplido").length;
  const pendientes = cedulas.filter((c) => c.estatus === "Pendiente").length;
  const enProceso = cedulas.filter((c) => c.estatus === "En Proceso").length;
  const vencidas = cedulas.filter((c) => c.estatus === "Vencido").length;
  const cumplimiento = total > 0 ? Math.round((cumplidas / total) * 100) : 0;

  // Agrupar por instalación
  const instMap = {};
  cedulas.forEach((c) => {
    if (!instMap[c.instalacion]) instMap[c.instalacion] = { total: 0, cumplidas: 0 };
    instMap[c.instalacion].total++;
    if (c.estatus === "Cumplido") instMap[c.instalacion].cumplidas++;
  });
  const barrasData = Object.entries(instMap).map(([name, d]) => ({
    name,
    Cumplidas: d.cumplidas,
    Pendientes: d.total - d.cumplidas,
  }));

  // Riesgo
  const riesgoMap = {};
  cedulas.forEach((c) => { riesgoMap[c.nivel_riesgo] = (riesgoMap[c.nivel_riesgo] || 0) + 1; });
  const pastelRiesgo = Object.entries(riesgoMap).map(([name, value]) => ({ name, value }));

  // Estatus
  const estatusMap = {};
  cedulas.forEach((c) => { estatusMap[c.estatus] = (estatusMap[c.estatus] || 0) + 1; });
  const pastelEstatus = Object.entries(estatusMap).map(([name, value]) => ({ name, value }));

  // Últimos registros
  const ultimos = [...cedulas].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 5);

  return (
    <div className="space-y-6">
      {/* KPIs */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <KpiCard icon={FileText} label="Total Cédulas" value={total} sub="Registros activos" color="bg-gradient-to-br from-blue-500 to-blue-700" />
        <KpiCard icon={CheckCircle} label="Cumplimiento" value={`${cumplimiento}%`} sub={`${cumplidas} de ${total} cumplidas`} color="bg-gradient-to-br from-green-500 to-green-700" />
        <KpiCard icon={AlertTriangle} label="Pendientes" value={pendientes + vencidas} sub={`${pendientes} pendientes, ${vencidas} vencidas`} color="bg-gradient-to-br from-red-500 to-red-700" />
        <KpiCard icon={ClipboardList} label="En Proceso" value={enProceso} sub="En atención" color="bg-gradient-to-br from-amber-500 to-amber-700" />
      </div>

      {/* Charts */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-slate-800/60 rounded-2xl border border-slate-700/50 p-5">
          <h3 className="text-sm font-semibold text-slate-300 mb-4">Cumplimiento por Instalación</h3>
          <ResponsiveContainer width="100%" height={280}>
            <BarChart data={barrasData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
              <XAxis dataKey="name" tick={{ fill: "#94a3b8", fontSize: 12 }} />
              <YAxis tick={{ fill: "#94a3b8" }} />
              <Tooltip contentStyle={{ background: "#1e293b", border: "1px solid #334155", borderRadius: "8px", color: "#f8fafc" }} />
              <Legend />
              <Bar dataKey="Cumplidas" fill={COLORS.green} radius={[4, 4, 0, 0]} />
              <Bar dataKey="Pendientes" fill={COLORS.red} radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>

        <div className="bg-slate-800/60 rounded-2xl border border-slate-700/50 p-5">
          <h3 className="text-sm font-semibold text-slate-300 mb-4">Distribución de Riesgos</h3>
          <ResponsiveContainer width="100%" height={280}>
            <PieChart>
              <Pie data={pastelRiesgo} cx="50%" cy="50%" outerRadius={90} dataKey="value" label={({ name, percent }) => `${name} ${(percent * 100).toFixed(0)}%`}>
                {pastelRiesgo.map((_, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
              </Pie>
              <Tooltip contentStyle={{ background: "#1e293b", border: "1px solid #334155", borderRadius: "8px", color: "#f8fafc" }} />
            </PieChart>
          </ResponsiveContainer>
        </div>

        <div className="bg-slate-800/60 rounded-2xl border border-slate-700/50 p-5">
          <h3 className="text-sm font-semibold text-slate-300 mb-4">Estatus de Cédulas</h3>
          <ResponsiveContainer width="100%" height={280}>
            <PieChart>
              <Pie data={pastelEstatus} cx="50%" cy="50%" outerRadius={90} dataKey="value" label={({ name, percent }) => `${name} ${(percent * 100).toFixed(0)}%`}>
                {pastelEstatus.map((e, i) => <Cell key={i} fill={STATUS_COLORS[e.name] || PIE_COLORS[i % PIE_COLORS.length]} />)}
              </Pie>
              <Tooltip contentStyle={{ background: "#1e293b", border: "1px solid #334155", borderRadius: "8px", color: "#f8fafc" }} />
            </PieChart>
          </ResponsiveContainer>
        </div>

        <div className="bg-slate-800/60 rounded-2xl border border-slate-700/50 p-5">
          <h3 className="text-sm font-semibold text-slate-300 mb-4">Últimos Registros</h3>
          <div className="space-y-2">
            {ultimos.length === 0 && <p className="text-sm text-slate-500">Sin registros</p>}
            {ultimos.map((c) => (
              <div key={c.id} className="flex items-center justify-between p-3 bg-slate-900/40 rounded-xl border border-slate-700/30">
                <div>
                  <p className="text-sm text-white font-medium">{c.folio}</p>
                  <p className="text-xs text-slate-400">{c.instalacion} — {c.rubro}</p>
                </div>
                <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${
                  c.estatus === "Cumplido" ? "bg-green-500/20 text-green-400" :
                  c.estatus === "Pendiente" ? "bg-red-500/20 text-red-400" :
                  c.estatus === "En Proceso" ? "bg-blue-500/20 text-blue-400" :
                  "bg-orange-500/20 text-orange-400"
                }`}>
                  {c.estatus}
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
//  CÉDULAS (CMSH)
// ════════════════════════════════════════════════════════════════════

const CEDULA_FIELDS = [
  { key: "folio", label: "Folio", type: "text" },
  { key: "instalacion", label: "Instalación", type: "text" },
  { key: "rubro", label: "Rubro", type: "select", options: ["Seguridad Estructural", "Instalaciones Eléctricas", "Protección Contra Incendios", "Señalización", "Manejo de Materiales", "Equipo de Protección Personal", "Condiciones Sanitarias", "Emergencias", "Capacitación"] },
  { key: "nivel_riesgo", label: "Nivel de Riesgo", type: "select", options: ["Alto", "Medio", "Bajo"] },
  { key: "descripcion", label: "Descripción", type: "textarea" },
  { key: "estatus", label: "Estatus", type: "select", options: ["Pendiente", "En Proceso", "Cumplido", "Vencido"] },
  { key: "fecha", label: "Fecha", type: "date" },
  { key: "responsable", label: "Responsable", type: "text" },
];

function CedulasTab({ cedulas, setCedulas, filters }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({});

  const filtered = useMemo(() =>
    cedulas.filter((c) =>
      (!filters.rubro || c.rubro === filters.rubro) &&
      (!filters.instalacion || c.instalacion === filters.instalacion) &&
      (!filters.nivel_riesgo || c.nivel_riesgo === filters.nivel_riesgo) &&
      (!filters.estatus || c.estatus === filters.estatus)
    ), [cedulas, filters]);

  const openCreate = () => {
    setEditing(null);
    setForm({
      folio: `CMSH-${String(cedulas.length + 1).padStart(3, "0")}`,
      instalacion: "", rubro: "", nivel_riesgo: "Medio",
      descripcion: "", estatus: "Pendiente", fecha: today(), responsable: ""
    });
    setModalOpen(true);
  };

  const openEdit = (c) => { setEditing(c.id); setForm({ ...c }); setModalOpen(true); };

  const save = () => {
    if (!form.folio || !form.instalacion || !form.rubro || !form.responsable) {
      toast.error("Completa los campos obligatorios: Folio, Instalación, Rubro y Responsable", { style: toastStyle });
      return;
    }
    let updated;
    if (editing) {
      updated = cedulas.map((c) => c.id === editing ? { ...form, id: editing } : c);
      toast.success("Cédula actualizada", { style: toastStyle });
    } else {
      updated = [...cedulas, { ...form, id: generateId() }];
      toast.success("Cédula creada", { style: toastStyle });
    }
    setCedulas(updated);
    saveData(STORAGE_KEYS.CEDULAS, updated);
    setModalOpen(false);
  };

  const remove = (id) => {
    if (!confirm("¿Eliminar esta cédula?")) return;
    const updated = cedulas.filter((c) => c.id !== id);
    setCedulas(updated);
    saveData(STORAGE_KEYS.CEDULAS, updated);
    toast.success("Cédula eliminada", { style: toastStyle });
  };

  const FormField = ({ field }) => {
    const val = form[field.key] || "";
    const setVal = (v) => setForm({ ...form, [field.key]: v });
    if (field.type === "select") {
      return (
        <select value={val} onChange={(e) => setVal(e.target.value)}
          className="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
        >
          <option value="">Seleccionar...</option>
          {field.options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      );
    }
    if (field.type === "textarea") {
      return (
        <textarea value={val} onChange={(e) => setVal(e.target.value)} rows={3}
          className="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 resize-none"
        />
      );
    }
    return (
      <input type={field.type} value={val} onChange={(e) => setVal(e.target.value)}
        className="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
      />
    );
  };

  return (
    <div>
      <div className="flex flex-wrap gap-3 mb-4">
        <button onClick={openCreate} className="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-sm font-medium rounded-xl hover:from-cyan-400 hover:to-blue-500 transition-all shadow-lg shadow-cyan-500/25">
          <Plus size={16} /> Nueva Cédula
        </button>
      </div>

      <div className="overflow-x-auto rounded-2xl border border-slate-700/50">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-slate-800/80">
              {["Folio", "Instalación", "Rubro", "Riesgo", "Descripción", "Estatus", "Fecha", "Responsable", "Acciones"].map((h) => (
                <th key={h} className="text-left px-4 py-3 text-slate-400 font-medium text-xs uppercase tracking-wider">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-700/50">
            {filtered.length === 0 && (
              <tr><td colSpan={9} className="text-center py-12 text-slate-500">No hay registros</td></tr>
            )}
            {filtered.map((c) => (
              <tr key={c.id} className="hover:bg-slate-800/40 transition-colors">
                <td className="px-4 py-3 text-white font-medium">{c.folio}</td>
                <td className="px-4 py-3 text-slate-300">{c.instalacion}</td>
                <td className="px-4 py-3 text-slate-300">{c.rubro}</td>
                <td className="px-4 py-3">
                  <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${
                    c.nivel_riesgo === "Alto" ? "bg-red-500/20 text-red-400" :
                    c.nivel_riesgo === "Medio" ? "bg-yellow-500/20 text-yellow-400" :
                    "bg-green-500/20 text-green-400"
                  }`}>{c.nivel_riesgo}</span>
                </td>
                <td className="px-4 py-3 text-slate-400 max-w-[200px] truncate">{c.descripcion}</td>
                <td className="px-4 py-3">
                  <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${
                    c.estatus === "Cumplido" ? "bg-green-500/20 text-green-400" :
                    c.estatus === "Pendiente" ? "bg-red-500/20 text-red-400" :
                    c.estatus === "En Proceso" ? "bg-blue-500/20 text-blue-400" :
                    "bg-orange-500/20 text-orange-400"
                  }`}>{c.estatus}</span>
                </td>
                <td className="px-4 py-3 text-slate-300">{formatDate(c.fecha)}</td>
                <td className="px-4 py-3 text-slate-300">{c.responsable}</td>
                <td className="px-4 py-3">
                  <div className="flex gap-1.5">
                    <button onClick={() => openEdit(c)} className="p-2 text-slate-400 hover:text-cyan-400 hover:bg-slate-700/50 rounded-lg transition-all" title="Editar"><Pencil size={15} /></button>
                    <button onClick={() => remove(c.id)} className="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-700/50 rounded-lg transition-all" title="Eliminar"><Trash2 size={15} /></button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <Modal isOpen={modalOpen} onClose={() => setModalOpen(false)} title={editing ? "Editar Cédula" : "Nueva Cédula"}>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {CEDULA_FIELDS.map((f) => (
            <div key={f.key} className={f.type === "textarea" ? "md:col-span-2" : ""}>
              <label className="block text-sm text-slate-300 mb-1.5">{f.label}</label>
              <FormField field={f} />
            </div>
          ))}
        </div>
        <div className="flex justify-end gap-3 mt-6">
          <button onClick={() => setModalOpen(false)} className="px-4 py-2.5 text-sm text-slate-400 hover:text-white bg-slate-900/60 border border-slate-700 rounded-xl hover:bg-slate-700/50 transition-all">Cancelar</button>
          <button onClick={save} className="px-4 py-2.5 text-sm text-white bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl hover:from-cyan-400 hover:to-blue-500 transition-all shadow-lg shadow-cyan-500/25">
            {editing ? "Guardar Cambios" : "Crear Cédula"}
          </button>
        </div>
      </Modal>
    </div>
  );
}

function Reuniones({ reuniones, setReuniones }) {
  const [modalOpen, setModalOpen] = useState(false);

  const openCreate = () => {
    setEditing(null);
    setForm({ fecha: today(), hora: "09:00", lugar: "", orden_del_dia: "", participantes: "", acuerdos: "" });
    setModalOpen(true);
  };

  const openEdit = (r) => { setEditing(r.id); setForm({ ...r }); setModalOpen(true); };

    if (!form.fecha || !form.hora || !form.lugar) {
      toast.error("Completa los campos obligatorios: Fecha, Hora y Lugar", { style: toastStyle });
      return;
    }
    let updated;
    if (editing) {
      updated = reuniones.map((r) => r.id === editing ? { ...form, id: editing } : r);

      updated = [...reuniones, { ...form, id: generateId() }];
      toast.success("Reunión creada", { style: toastStyle });
    }
    setReuniones(updated);
    saveData(STORAGE_KEYS.REUNIONES, updated);
    setModalOpen(false);
  };

    saveData(STORAGE_KEYS.REUNIONES, updated);

              </div>

              placeholder="1. ...&#10;2. ...&#10;3. ..."

          </div>
          <div className="md:col-span-2">
            <label className="block text-sm text-slate-300 mb-1.5">Participantes</label>
            <input type="text" value={form.participantes || ""} onChange={(e) => setForm({ ...form, participantes: e.target.value })}
              className="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
              placeholder="Nombre1, Nombre2, ..."
            />
          </div>
          <div className="md:col-span-2">
            <label className="block text-sm text-slate-300 mb-1.5">Acuerdos</label>
            <textarea value={form.acuerdos || ""} onChange={(e) => setForm({ ...form, acuerdos: e.target.value })}
              rows={4}
              className="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 resize-none"
              placeholder="Acuerdos y compromisos..."
            />
          </div>
        </div>
        <div className="flex justify-end gap-3 mt-6">
          <button onClick={() => setModalOpen(false)} className="px-4 py-2.5 text-sm text-slate-400 hover:text-white bg-slate-900/60 border border-slate-700 rounded-xl hover:bg-slate-700/50 transition-all">Cancelar</button>
          <button onClick={save} className="px-4 py-2.5 text-sm text-white bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl hover:from-cyan-400 hover:to-blue-500 transition-all shadow-lg shadow-cyan-500/25">
            {editing ? "Guardar Cambios" : "Crear Reunión"}
          </button>
        </div>
      </Modal>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════
//  MAIN APP
// ════════════════════════════════════════════════════════════════════

function App() {
  const { user, loading, login, register, logout } = useAuth();
  const [tab, setTab] = useState("panel");
  const [cedulas, setCedulas] = useState([]);
  const [reuniones, setReuniones] = useState([]);
  const [filters, setFilters] = useState({ rubro: "", instalacion: "", nivel_riesgo: "", estatus: "" });
  const fileInputRef = useRef(null);

  useEffect(() => {
    setCedulas(loadData(STORAGE_KEYS.CEDULAS, DEFAULT_CEDULAS));
    setReuniones(loadData(STORAGE_KEYS.REUNIONES, DEFAULT_REUNIONES));
  }, []);

  // Options for filters
  const filterOptions = useMemo(() => {
    const rubros = [...new Set(cedulas.map((c) => c.rubro))].sort();
    const instalaciones = [...new Set(cedulas.map((c) => c.instalacion))].sort();
    const riesgos = ["Alto", "Medio", "Bajo"];
    const estatuses = ["Cumplido", "Pendiente", "En Proceso", "Vencido"];
    return { rubros, instalaciones, riesgos, estatuses };
  }, [cedulas]);

  // Data filtered for export
  const getFilteredCedulas = useCallback(() =>
    cedulas.filter((c) =>
      (!filters.rubro || c.rubro === filters.rubro) &&
      (!filters.instalacion || c.instalacion === filters.instalacion) &&
      (!filters.nivel_riesgo || c.nivel_riesgo === filters.nivel_riesgo) &&
      (!filters.estatus || c.estatus === filters.estatus)
    ), [cedulas, filters]);

  // ── CSV IMPORT ──
  const handleCsvImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const text = evt.target.result;
        const lines = text.split(/\r?\n/).filter((l) => l.trim());
        if (lines.length < 2) {
          toast.error("El CSV debe tener encabezados y al menos una fila", { style: toastStyle });
          return;
        }
        const headers = lines[0].split(",").map((h) => h.trim().toLowerCase().replace(/[^a-záéíóúñ\s]/g, ""));

        // Detect type
        const isReunion = headers.some((h) => h.includes("orden") || h.includes("acuerd") || h.includes("particip"));
        const isCedula = headers.some((h) => h.includes("folio") || h.includes("riesgo") || h.includes("cédula") || h.includes("cedula"));

        const mapHeader = (h) => {
          if (h.includes("folio")) return "folio";
          if (h.includes("instal") || h.includes("ubicaci")) return "instalacion";
          if (h.includes("rubro") || h.includes("categor")) return "rubro";
          if (h.includes("riesg") || h.includes("nivel")) return "nivel_riesgo";
          if (h.includes("descrip") || h.includes("observ") || h.includes("hallazg")) return "descripcion";
          if (h.includes("status") || h.includes("estado") || h.includes("estat")) return "estatus";
          if (h.includes("fecha")) return "fecha";
          if (h.includes("respon") || h.includes("asign") || h.includes("encarg")) return "responsable";
          if (h.includes("acuerd") || h.includes("comprom")) return "acuerdos";
          if (h.includes("particip") || h.includes("asisten") || h.includes("invitad")) return "participantes";
          if (h.includes("lugar") || h.includes("ubicac") || h.includes("sala")) return "lugar";
          if (h.includes("hora")) return "hora";
          if (h.includes("orden") || h.includes("agend") || h.includes("temas")) return "orden_del_dia";
          return null;
        };

        const mapped = headers.map((h) => mapHeader(h));
        const rows = lines.slice(1).map((line) => {
          const vals = line.split(",").map((v) => v.trim().replace(/^"|"$/g, ""));
          const obj = { id: generateId() };
          mapped.forEach((key, i) => { if (key && vals[i]) obj[key] = vals[i]; });
          return obj;
        });

        const validRows = rows.filter((r) => Object.keys(r).length > 1);
        if (validRows.length === 0) {
          toast.error("No se pudieron parsear filas válidas", { style: toastStyle });
          return;
        }

        if (isReunion && !isCedula) {
          const merged = [...reuniones, ...validRows];
          setReuniones(merged);
          saveData(STORAGE_KEYS.REUNIONES, merged);
          toast.success(`${validRows.length} reuniones importadas`, { style: toastStyle });
        } else {
          const merged = [...cedulas, ...validRows];
          setCedulas(merged);
          saveData(STORAGE_KEYS.CEDULAS, merged);
          toast.success(`${validRows.length} cédulas importadas`, { style: toastStyle });
        }
      } catch (err) {
        toast.error("Error al leer el archivo CSV", { style: toastStyle });
      }
    };
    reader.readAsText(file, "UTF-8");
    e.target.value = "";
  };

  // ── CSV EXPORT ──
  const handleCsvExport = () => {
    const data = getFilteredCedulas();
    if (data.length === 0) {
      toast.error("No hay datos para exportar", { style: toastStyle });
      return;
    }
    const headers = ["Folio", "Instalación", "Rubro", "Nivel de Riesgo", "Descripción", "Estatus", "Fecha", "Responsable"];
    const rows = data.map((c) => [
      c.folio, c.instalacion, c.rubro, c.nivel_riesgo,
      `"${(c.descripcion || "").replace(/"/g, '""')}"`,
      c.estatus, c.fecha, c.responsable,
    ].join(","));
    const csv = "\uFEFF" + [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `cmsh_export_${today()}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
    toast.success(`${data.length} registros exportados`, { style: toastStyle });
  };

  if (loading) {
    return (
      <div className="min-h-screen bg-slate-900 flex items-center justify-center">
        <div className="w-8 h-8 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin" />
      </div>
    );
  }

  if (!user) {
    return <LoginPage onLogin={login} onRegister={register} />;
  }

  return (
    <div className="min-h-screen bg-slate-900">
      <Toaster position="top-right" toastOptions={{ duration: 3000 }} />

      {/* ── HEADER ── */}
      <header className="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/50">
        <div className="max-w-7xl mx-auto px-4 sm:px-6">
          <div className="flex items-center justify-between h-16">
            <div className="flex items-center gap-3">
              <div className="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20">
                <ShieldAlert className="w-5 h-5 text-white" />
              </div>
              <div>
                <h1 className="text-lg font-bold text-white">CMSH</h1>
                <p className="text-xs text-slate-500">Panel de Seguridad e Higiene</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <span className="text-sm text-slate-400 hidden sm:block">
                <span className="text-cyan-400">{user.name}</span>
              </span>
              <button
                onClick={logout}
                className="flex items-center gap-2 px-3 py-2 text-sm text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-xl transition-all"
              >
                <LogOut size={16} />
                <span className="hidden sm:inline">Salir</span>
              </button>
            </div>
          </div>

          {/* Tabs */}
          <div className="flex gap-2 pb-3 overflow-x-auto">
            <TabButton active={tab === "panel"} onClick={() => setTab("panel")} icon={LayoutDashboard} label="Panel Directivo" />
            <TabButton active={tab === "cedulas"} onClick={() => setTab("cedulas")} icon={ListChecks} label="Recorridos y Cédulas" />
            <TabButton active={tab === "reuniones"} onClick={() => setTab("reuniones")} icon={CalendarDays} label="Reuniones" />
          </div>
        </div>
      </header>

      {/* ── CONTENT ── */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {/* Global actions */}
        <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
          <h2 className="text-xl font-bold text-white">
            {tab === "panel" && "Panel Directivo"}
            {tab === "cedulas" && "Recorridos y Cédulas (CMSH)"}
            {tab === "reuniones" && "Reuniones y Minutas"}
          </h2>
          <div className="flex flex-wrap gap-3">
            <input
              ref={fileInputRef}
              type="file"
              accept=".csv"
              onChange={handleCsvImport}
              className="hidden"
            />
            <button
              onClick={() => fileInputRef.current?.click()}
              className="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-green-500 to-emerald-600 text-white text-sm font-medium rounded-xl hover:from-green-400 hover:to-emerald-500 transition-all shadow-lg shadow-green-500/25"
            >
              <Upload size={16} /> Importar CSV
            </button>
            <button
              onClick={handleCsvExport}
              className="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-purple-500 to-violet-600 text-white text-sm font-medium rounded-xl hover:from-purple-400 hover:to-violet-500 transition-all shadow-lg shadow-purple-500/25"
            >
              <Download size={16} /> Exportar CSV
            </button>
          </div>
        </div>

        {/* Filters (only for cedulas and panel) */}
        {tab !== "reuniones" && (
          <FilterBar filters={filters} setFilters={setFilters} options={filterOptions} />
        )}

        {/* Tab content */}
        {tab === "panel" && <PanelDirectivo cedulas={getFilteredCedulas()} />}
        {tab === "cedulas" && <CedulasTab cedulas={cedulas} setCedulas={setCedulas} filters={filters} />}
        {tab === "reuniones" && <Reuniones reuniones={reuniones} setReuniones={setReuniones} />}
      </main>

      {/* ── FOOTER ── */}
      <footer className="border-t border-slate-800/50 py-4 mt-8">
        <p className="text-center text-xs text-slate-600">
          CMSH — Control de Seguridad e Higiene &copy; {new Date().getFullYear()}
        </p>
      </footer>
    </div>
  );
}


      		  createRoot(document.getElementById("root")).render(
             <>
      		    <App />
              </>
      		    );
              window.parent.postMessage({ action: "ready" }, "*");
    </script>
  </body>
</html>
